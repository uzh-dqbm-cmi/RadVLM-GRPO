### model
model_name_or_path: /capstor/scratch/cscs/ndeperr/checkpoints/qwen2.5VL_full
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: false
freeze_multi_modal_projector: false
freeze_language_model: false
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset: radvlm_dataset, coldstart_grounding, coldstart_mimic
template: qwen2_vl
cutoff_len: 131072
max_samples: 10000000
tokenized_path: /capstor/scratch/cscs/ndeperr/checkpoints/qwen2.5vl_full_qwen3VLCS/tokenizer
overwrite_cache: false
preprocessing_num_workers: 64
dataloader_num_workers: 32
enable_thinking: false

### output
output_dir: /capstor/store/cscs/swissai/a135/RadVLM_project/models/qwen2.5vl_full_qwen3VLCS
save_steps: 200
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: wandb  # choices: [none, wandb, tensorboard, swanlab, mlflow]
logging_steps: 10


### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
learning_rate: 1.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03

